# The CV, as data.  The only authoritative copy.  See ADR-003.
#
# Four copies of the CV existed and they disagreed: the `williamdemeo/cv`
# README (the 2024 CV), the Zola site's `cv/index.md` (December 2021), the
# `demeo_cv.pdf` in the GitLab job-app repository (June 2022), and `docs/cv.md`.
# They are merged here.  The three that are not `docs/cv.md` are snapshotted
# under `import/legacy-cv/` and nothing edits them.
#
# ── What is *not* here ─────────────────────────────────────────────────────
#
# **Publications.**  `bibliography.json` is the only authoritative publication
# list (ADR-006), and `docs/cv.md` includes the snippet
# `gen_publications.py` renders from it.  The `publications:` block below holds
# ids, not publications: it exists so `check_cv_sources.py` can prove that
# every publication in every legacy copy reached that file, and for no other
# reason.  Adding a paper means editing `bibliography.json`, never this file.
#
# ── The checker ────────────────────────────────────────────────────────────
#
#     make cv-check
#
# reads all four copies and fails unless every entry in every one of them is
# either covered by an entry here or named in `omissions:` with a reason.  It
# is not looking for a well-formed file; it is looking for the thing this merge
# could plausibly have lost.
#
# ── Fields ─────────────────────────────────────────────────────────────────
#
# `aliases:`   How other copies wrote the same thing.  Not decoration: the
#              checker asks whether an entry contains every significant word of
#              a source entry, so an abbreviation only one copy used lives here
#              rather than being lost or smuggled into the prose.
#
#              Three are not variants at all.  "Adjunct Instructor" and "Ali
#              Latfi" are errors, and "MathematicsHonolulu" is a conversion
#              artifact -- a dropped `\hfill`.  All three are kept only so the
#              copies containing them still resolve to the right entry.  Each
#              says so where it sits.  Nothing renders `aliases:`.
#
# `disputed:`  Two copies assert different facts and the disagreement is not
#              the merge's to settle.  **None are open**: the three this merge
#              found were settled by William and are recorded in ADR-003 with
#              what he decided.  The field stays documented because the next
#              edit to this file may well find another.
#
# `sources:`   Not used.  Provenance is proved by the checker against the
#              snapshots rather than asserted per entry -- a hand-maintained
#              provenance list is another copy that can drift.

meta:
  title: Curriculum Vitae
  name: William DeMeo
  merged: 2026-08-03
  # #42 (M7-2) brings the content current; #41 (M7-1) renders it to web and
  # PDF.  This file is the merge, not the rewrite: where the copies disagreed
  # about wording it keeps what they said.

contact:
  email: williamdemeo@gmail.com
  url: https://williamdemeo.org
  aliases: [williamdemeo.org]
  # Six more aliases sat here and all six were dead.  "url", "tel" and
  # "address" duplicate the field names, which already count as words; the
  # other three were a Prague institutional address taken from the 2021 LaTeX
  # in the job-app repository -- not one of the four copies this file is
  # checked against.  `aliases:` means "how another copy wrote this", so an
  # alias no copy contains is a provenance claim with nothing behind it.
  # Removed on review of #91, where a misspelling in one of them is what drew
  # attention to the fact that none of them was load-bearing.
  #
  # The street addresses and telephone numbers the copies do carry are in
  # `omissions:`.  A CV on a public website has no use for them.

research_interests:
  - summary: >-
      Interactive theorem proving and formalization of mathematics (Agda, Lean);
      formal methods for production systems; AI tooling for proof assistants and
      machine reasoning over verifiable domains; universal algebra, lattice
      theory, and the algebraic approach to computational complexity.
    theory: >-
      Universal algebra, logic, lattice theory, proof theory, category theory,
      type theory, complexity theory, algorithmic complexity, machine learning.
    practice: >-
      Proof mechanization in Agda and Lean, computer-aided mathematics, formal
      verification, functional programming for AI, ML and Big Data in
      Scala/Spark.
    # Each copy stated these differently, at four different moments.  The
    # vocabulary of all four is kept so that none of it is lost before #42
    # rewrites the section.
    aliases:
      - Computational complexity, type theory, artificial intelligence
      - dsLLM, RAG, Scala/Spark, PyTorch
      - Computer-aided mathematics (ITP in Agda and Lean)
      - formal methods for blockchain research
      - Theory. Practice.
      - functional programming for Big Data

