     reason: "a pointer to arXiv and to #30; the publications are in bibliography.json"}
  - {id: "site:teaching:a-decade-of-teaching-across-six-institutions",
     reason: "a prose summary standing in for the record until #32; the record is in `teaching:`"}

  # ── Publication status, as of the copy that recorded it ──────────────────
  #
  # "accepted", "submitted", "to appear" describe where a paper stood when
  # someone wrote it down.  All three works are published, and bibliography.json
  # records the version of record (ADR-006), so carrying the old status forward
  # would be carrying something that has since become false.
  - {id: "zola:publications:accepted-to-appear-in-logical-methods-in-com",
     reason: "status in December 2021; the LMCS paper appeared in January 2022"}
  - {id: "zola:publications:submitted-27th-intl-conf-on-types-for-proofs",
     reason: "status in December 2021; the TYPES paper appeared in August 2022"}
  - {id: "jobapp:publications:accepted",
     reason: "status in June 2022, on the TYPES and LMCS entries"}

  # ── Bibliographic detail bibliography.json does not record ───────────────
  #
  # These are the only omissions that lose anything a reader might want, and
  # each is a change to ADR-006's file rather than to this one.  Listed in
  # ADR-003 so they are decided rather than forgotten.
  - id: "zola:publications:proceedings-of-algebras-and-lattices-in-hawa"
    reason: >-
      Lulu Press as the publisher of the ALH 2018 proceedings.  bibliography.json
      has no publisher for `adaricheva2018alh`, and its own `_comment` already
      says publisher, ISBN and a stable URL would have to come from William.
      Adding it is an edit to that file and to what it renders.
  - id: "jobapp:publications:12-1-12-37-2022-preprint-link"
    reason: >-
      The page range 12:1--12:37 for the LMCS article.  bibliography.json
      records volume and issue for `bergman2022universal` but no pages, and the
      DOI carries the article number.  Adding pages is an edit to that file.
  - id: "cvrepo:publications:proc-27th-intl-conf-types-for-proofs-and-pro"
    reason: >-
      The venue written as "Proc. 27th Intl. Conf. …".  bibliography.json names
      the conference rather than its proceedings volume, which is ADR-006's
      rule about saying what the publisher records.  The work itself is
      `demeo2022birkhoff`.
  - {id: "jobapp:publications:proc-27th-intl-conf-types-for-proofs-and-pro",
     reason: "as above, in the 2022 PDF"}
