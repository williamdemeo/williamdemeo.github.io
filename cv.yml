# ── Deliberate omissions ───────────────────────────────────────────────────
#
# Every entry in every copy is either above or here.  An id names a row of
# `import/legacy-cv/inventory.tsv`; `make cv-check` fails on one that names no
# row, and it also fails on one that *is* covered above, so a declaration can
# neither outlive the thing it was about nor quietly contradict it.
#
# Six kinds, and only the last two are about the CV's content at all.

