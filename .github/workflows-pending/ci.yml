name: build

# Pull requests only.  Pushes to main are covered by the deploy workflow,
# which runs the same strict build before publishing, so running this here
# too would just duplicate the work.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: nix flake check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@v22

      # Restore only.  A cache written on a pull-request ref is readable by
      # that pull request alone, so saving here would upload a few hundred
      # megabytes nothing else can use; the deploy workflow writes the cache
      # that pull requests restore from.
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          save: false

      # Builds every check in flake.nix: the strict site build, the
      # Cairo/Pango/font probe the social cards need (M3-5), and the
      # assertion that requirements.txt still matches the Nix environment.
      # --strict turns warnings into errors, so a broken internal link or a
      # reference to a missing page fails the pull request rather than
      # shipping quietly.
      - name: Check
        run: nix flake check --print-build-logs

      # ADR-004 promises that `make serve` works in a fresh dev shell with no
      # further setup.  `make check` exercises the same wiring -- shell
      # provides MkDocs, Makefile finds it and skips the virtualenv -- and is
      # the part most likely to break without anyone noticing.
      - name: make check inside the dev shell
        run: nix develop --command make check
