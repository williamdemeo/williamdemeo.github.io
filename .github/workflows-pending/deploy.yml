name: deploy

# Publishes to GitHub Pages using the Actions deployment path
# (configure-pages / upload-pages-artifact / deploy-pages) rather than
# pushing a gh-pages branch.  This keeps built output out of git history,
# which is exactly the mistake the Octopress site made -- 22 MB of generated
# HTML committed to the repository root for eight years.
#
# Requires Settings -> Pages -> Source set to "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Serialize deployments.  cancel-in-progress is deliberately false: a
# half-finished deploy that gets cancelled can leave Pages in an inconsistent
# state, so queued runs wait rather than interrupt.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install pinned dependencies
        run: pip install -r requirements.txt

      - name: Build
        run: mkdocs build --strict

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
