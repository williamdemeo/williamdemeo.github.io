name: deploy

# Publishes to GitHub Pages using the Actions deployment path
# (configure-pages / upload-pages-artifact / deploy-pages) rather than
# pushing a gh-pages branch.  This keeps built output out of git history,
# which is exactly the mistake the Octopress site made -- 22 MB of generated
# HTML committed to the repository root for eight years.
#
# Requires Settings -> Pages -> Source set to "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Serialize deployments.  cancel-in-progress is deliberately false: a
# half-finished deploy that gets cancelled can leave Pages in an inconsistent
# state, so queued runs wait rather than interrupt.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@v22

      # The write side of the cache the build workflow reads.  Only pushes to
      # main land here, and only caches on the default branch are visible to
      # pull requests, so this is the one place saving is worth the upload.
      #
      # gc-max-store-size bounds what gets uploaded: the dev shell closure is
      # about 450 MiB, and trimming to 2 GiB keeps the whole store (Nix
      # itself, the nixpkgs source, the build closure) comfortably under
      # GitHub's 10 GB per-repository cache limit.  Stale entries are left to
      # GitHub's own eviction rather than purged here, which would need
      # `actions: write` and fails on forks.
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 2G

      # The same derivation a contributor gets from `nix build`, and the same
      # one `nix flake check` builds on every pull request -- so what deploys
      # is bit-for-bit what was reviewed, not a rebuild that happens to agree.
      - name: Build
        run: nix build --print-build-logs

      # upload-pages-artifact wants a real directory it can read: `result` is
      # a symlink into the store, and store paths are read-only.
      - name: Stage the built site
        run: |
          rm -rf site
          cp -rL --no-preserve=mode,ownership result site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
