# MkDocs configuration for williamdemeo.github.io
#
# Kept deliberately small at this stage.  Plugin choices that matter later --
# blog (M6-1), redirects (M2-6), social cards (M3-5), RSS -- are added by the
# issues that need them, so a broken plugin is always attributable to the
# change that introduced it.

site_name: William DeMeo
site_description: >-
  Mathematician and formal verification engineer.  Interactive theorem proving
  in Agda, universal algebra, and AI tooling for proof assistants.
site_author: William DeMeo

# Until the williamdemeo.org cutover (M8-1) the canonical URL is the GitHub
# Pages user site.  Changing this also changes the generated sitemap, so it
# moves as part of that issue rather than early.
site_url: https://williamdemeo.github.io/

repo_url: https://github.com/williamdemeo/williamdemeo.github.io
repo_name: williamdemeo/williamdemeo.github.io
edit_uri: edit/main/docs/

# HTML is allowed here, and the footer is the right home for the archive link:
# reachable from every page, findable by a human, and not competing with the
# primary nav.  M2-9 (#67) requires exactly that combination.
copyright: >-
  Content CC BY 4.0, code MIT.  Built with MkDocs Material.
  &middot; <a href="/archive/">Archive</a>

# `docs/` predates this site as the home of project documentation.  Rather
# than move those files and break links from the issue tracker, exclude them
# from the build.  Publishing the ADRs is worth revisiting once there is a
# design system to render them into (M3-3); GITHUB_PROJECT.md is machine-
# maintained project state and is not site content in any case.
#
# `projects/_template.md` is the last entry and the one that is easy to get
# wrong: MkDocs does **not** skip underscore-prefixed files, so without this
# line the M4 project-page skeleton builds and ships as a page at
# `/projects/_template/`.  Verified both ways -- removing this line puts
# `site/projects/_template/index.html` back.
#
# `not_in_nav` is the trap, not the fix.  Without either entry the strict build
# does fail, but it fails with "not included in the nav", and silencing *that*
# by adding the file to `not_in_nav` leaves a green `--strict` build that
# publishes the template anyway.  Also checked, not assumed.  See ADR-008.
#
# Nothing in the built site may link to it: an excluded file is not a link
# target, and `--strict` says so.
exclude_docs: |
  GITHUB_PROJECT.md
  adr/
  _snippets/
  projects/_template.md

# Reachable by URL but deliberately absent from the nav.  Declaring it here
# rather than leaving it undeclared keeps `--strict` output clean, so a page
# that is *accidentally* orphaned still stands out.
# The archive (M2-9, #67) is the bulk of this: those pages are reachable at
# the URLs they have always had and are listed on the archive index, but they
# are deliberately absent from the primary nav -- kept for reference, not for
# reading.
not_in_nav: |
  design/rendering.md
  design/style.md
  archive/index.md
  agda-ualib/**
  python/**
  talks/**
  typefunc/**
  probability-quiz/**
  touchpad-forensics/**

theme:
  name: material
  language: en
  # Two overrides: partials/source.html, which drops the attribute that
  # makes Material fetch repository facts from api.github.com on every page
  # load, and 404.html, which replaces Material's boilerplate not-found page
  # with an unfillable Agda goal (#98).  Each file carries its reasoning.
  custom_dir: overrides
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    # The blog's nav entry has to be a *section*, because that is where the
    # blog plugin attaches its generated Archive and Categories views (it
    # reads `blog/index.md`'s parent to decide where they go, and a plain
    # top-level link has no parent).  Without this feature the section and its
    # index page would then appear as two entries, "Blog" containing "Blog".
    # It changes nothing else: Blog is the only section in the nav.
    - navigation.indexes
    - navigation.footer
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight
    - toc.follow
  # No Google Fonts.  Setting this to false is what removes the
  # <link rel=preconnect> to fonts.gstatic.com and the stylesheet from
  # fonts.googleapis.com that Material's base template emits otherwise;
  # docs/assets/fonts/fonts.css declares the self-hosted faces instead, and
  # tokens.css sets --md-text-font and --md-code-font to name them.  See #17.
  font: false
  # Dark first, and no `media:` on either entry.  Material selects the first
  # palette when nothing is stored, and a `media` key would hand that decision
  # back to the operating system -- which is the behaviour this replaces.  The
  # cost is real and is the reason it is written down: a visitor who has set a
  # light-mode preference system-wide now gets a dark page until they click the
  # toggle once, after which their choice is remembered in local storage.  A
  # dark default is the deliberate look of the site; a mathematics page read at
  # night is the common case.
  #
  # `custom` on primary and accent means "no built-in Material colour" -- the
  # values come from tokens.css.
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  icon:
    repo: fontawesome/brands/github

extra_css:
  # Order matters: the faces have to be declared before the tokens that name
  # them, and the tokens before the rules that use them.
  - assets/fonts/fonts.css
  - stylesheets/tokens.css
  - stylesheets/extra.css
  # Self-hosted KaTeX.  The Zola site loaded it from a CDN alongside a second
  # copy of MathJax; this ships one renderer, from this origin, with the
  # woff/ttf fallbacks stripped from the stylesheet since only woff2 is
  # shipped.  See ADR/#20.
  - assets/katex/katex.min.css

extra_javascript:
  - javascripts/katex-macros.js
  - assets/katex/katex.min.js
  - assets/katex/auto-render.min.js
  - javascripts/katex-init.js
  # Count-up for the home page's evidence strip (M3-2c, #95).  The strip's
  # numbers are in the HTML already; with this script absent, off, or under
  # reduced motion, the page simply shows them.
  - javascripts/evidence.js

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      permalink_title: Link to this section
  - pymdownx.details
  # Material's icon set, used for the inline :material-*: icons on the
  # contact and CV pages.  Bundled with mkdocs-material; no extra dependency.
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  # Standing notices live in docs/_snippets/ and every page that needs one
  # includes it, so the wording changes in one place.  There are two, and they
  # are two because they make different claims, not because a second mechanism
  # was invented: `archived.md` says a page is out of the current site and
  # unmaintained; `dated.md` says a post is still part of the site and still
  # stands, and was written a long time ago.  A post that is genuinely retired
  # gets the archived notice and moves to the archive area (M2-9).  M2-4 (#13)
  # uses `dated.md` on the posts it converts.
  - pymdownx.snippets:
      base_path: [docs/_snippets]
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  # Generic mode emits KaTeX-compatible markup.  M3-4 wires the renderer and
  # the custom macros the legacy posts rely on (`\bA` and friends).
  - pymdownx.arithmatex:
      generic: true

plugins:
  - search

  # The blog engine (M6-1, #35).  It ships *inside* mkdocs-material 9.5.49,
  # which requirements.txt already pins, so enabling it costs no dependency.
  #
  # The URL scheme below is not a free choice.  redirects.yml records what the
  # Octopress and Zola sites served and what still has to resolve; 37 of its
  # pending entries were blocked on this plugin.  ADR-007 records the decision
  # and the constraints that forced it.  In one line: posts are served at
  # /blog/<slug>/ with no date in the path, and every legacy URL -- Zola's
  # root-level /isotopy/ and Octopress's dated /2014/02/13/isotopy/ alike --
  # redirects there.
  - blog:
      blog_dir: blog
      post_dir: "{blog}/posts"

      # No date in the post URL.  Both legacy sites disagreed about the date
      # of the same post (Zola 2017-04-06, Octopress /2017/04/07/), which is
      # the whole argument in miniature: a date in a path is a fact about
      # publication that the path then has to keep being right about.  The
      # date is displayed, and it is in the archive; it is not in the URL.
      post_url_format: "{slug}"
      post_date_format: long
      post_readtime: true

      # `required`, not the default `optional`.  Without a separator the
      # plugin treats the *entire* post as its own excerpt and the blog index
      # becomes a wall of complete articles.  Requiring it makes a missing
      # `<!-- more -->` a build error instead of a silently ugly index page.
      post_excerpt: required

      # One author.  A byline repeated under every post on a personal site is
      # noise, and `.authors.yml` is a file to keep in step for no reader
      # benefit.  Turning this off is also what stops an `authors:` key in
      # front matter from failing the build against a file that is not there.
      authors: false

      # Categories are the blog's sections and generate real pages, at
      # /blog/category/<slug>/.  The allow-list makes an unlisted category a
      # build error: Octopress generated thirteen category pages for fifteen
      # posts, which is not a taxonomy, and the way that happens is one typo
      # or one improvised name at a time.  Growing this list is expected and
      # is one line; growing it by accident is not possible.
      categories_allowed:
        - Formal verification
        - Mathematics
        - Tooling

      # Archive views are per year, at /blog/archive/<yyyy>/.  Deliberately
      # not /archive/, which the site's own archive area (M2-9) already
      # serves and which redirects.yml pins as `keep`.
      archive: true
      archive_date_format: yyyy
      archive_url_date_format: yyyy

      # Five, not the default ten, so that /blog/page/2/ -- a real Octopress
      # URL in the inventory -- becomes a real page again once M2-4 (#13)
      # lands the remaining converted posts.  See redirects.yml.
      pagination: true
      pagination_per_page: 5

      # Drafts build locally and never deploy.  M6-2 (#36) owns the rest of
      # the authoring workflow, including `make post` and verifying the
      # exclusion against a real deploy; this is just the switch.
      draft: false
      draft_on_serve: true

  # Also bundled with mkdocs-material.  In the community edition this renders
  # one tags index -- a heading and a page list per tag, at /blog/tags/ --
  # rather than a page per tag, which is an Insiders feature.  Verified by
  # reading material/plugins/tags/plugin.py, not assumed.
  #
  # Tags and categories are not two names for one thing here: a category is
  # one of the three subjects above and gets its own page, a tag is a free
  # keyword and gets an anchor on the index.  ADR-007 records the division.
  - tags:
      tags_file: blog/tags.md

# Legacy-URL redirects.  The map lives in redirects.yml, where each entry
# carries its reasoning and its blocking issue; this hook emits the stubs.
#
# Deliberately not the mkdocs-redirects plugin: as of 1.2.3 it takes a hard
# dependency on `properdocs`, an entire alternative site generator that
# installs itself and advertises for a replacement on every build.  That is a
# large supply-chain surface, and two more packages to pin in flake.nix, for
# about forty lines of "write a meta-refresh file at a computed path".  See
# #15 and the module docstring.
hooks:
  - scripts/python/redirects_hook.py
  # Expands `<!-- recent-posts -->` into the most recent posts, so the home
  # page's writing list cannot go stale.  Same reasoning as the redirect hook:
  # about sixty lines against a dependency to pin in two places.  See #35.
  - scripts/python/recent_posts_hook.py
  # Expands `<!-- evidence-strip -->` from docs/assets/evidence.json, so the
  # displayed numbers and the commands that produced them cannot drift apart.
  # `make evidence` regenerates the JSON; see #95 and ADR-009.
  - scripts/python/evidence_hook.py

nav:
  - Home: index.md
  # Second, ahead of the blog, because M4 is the part of the site that does the
  # actual work of representing the author professionally and the blog opens
  # with decade-old posts (ADR-002).  Labelled "Projects" rather than
  # "Portfolio" so that the nav entry, the URL segment and the page's own H1 are
  # all the same word; a label that differs from its URL is small, permanent
  # friction.  The ordering *within* the page is a separate decision and is
  # argued in ADR-008.
  # A section rather than a plain link, for the same mechanical reason as Blog
  # below: `navigation.indexes` makes the section header itself the link to
  # /projects/, and the project pages then list underneath it.  A portfolio is
  # the one part of this site where a reader benefits from seeing the whole set
  # without going back to the index first.
  #
  # This list is ordered, and as project pages land its order should mirror ADR-008's.
  # It is a second place the ordering can drift from the index cards in
  # docs/projects/index.md, so update the two together when you add or reorder pages.
  # (For now, only pages that exist are listed.)
  #
  - Projects:
      - projects/index.md
      - projects/agda-algebras.md
      - projects/cardano-ledger.md
      - projects/universal-algebra.md
  # A section rather than a plain link, and the reason is in `features` above:
  # the blog plugin attaches Archive and Categories under `blog/index.md`'s
  # parent, and a top-level link has none.  `navigation.indexes` then makes
  # the section header itself the link to /blog/.
  - Blog:
      - blog/index.md
      - blog/tags.md
  - About: about.md
  - Publications: publications.md
  - CV: cv.md
  - Contact: contact.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/williamdemeo
      name: GitHub
    - icon: fontawesome/solid/graduation-cap
      link: https://scholar.google.com/citations?user=y1OQ07QAAAAJ
      name: Google Scholar
