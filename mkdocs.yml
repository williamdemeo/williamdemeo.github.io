# MkDocs configuration for williamdemeo.github.io
#
# Kept deliberately small at this stage.  Plugin choices that matter later --
# blog (M6-1), redirects (M2-6), social cards (M3-5), RSS -- are added by the
# issues that need them, so a broken plugin is always attributable to the
# change that introduced it.

site_name: William DeMeo
site_description: >-
  Mathematician and formal verification engineer.  Interactive theorem proving
  in Agda, universal algebra, and AI tooling for proof assistants.
site_author: William DeMeo

# Until the williamdemeo.org cutover (M8-1) the canonical URL is the GitHub
# Pages user site.  Changing this also changes the generated sitemap, so it
# moves as part of that issue rather than early.
site_url: https://williamdemeo.github.io/

repo_url: https://github.com/williamdemeo/williamdemeo.github.io
repo_name: williamdemeo/williamdemeo.github.io
edit_uri: edit/main/docs/

# HTML is allowed here, and the footer is the right home for the archive link:
# reachable from every page, findable by a human, and not competing with the
# primary nav.  M2-9 (#67) requires exactly that combination.
copyright: >-
  Content CC BY 4.0, code MIT.  Built with MkDocs Material.
  &middot; <a href="/archive/">Archive</a>

# `docs/` predates this site as the home of project documentation.  Rather
# than move those files and break links from the issue tracker, exclude them
# from the build.  Publishing the ADRs is worth revisiting once there is a
# design system to render them into (M3-3); GITHUB_PROJECT.md is machine-
# maintained project state and is not site content in any case.
exclude_docs: |
  GITHUB_PROJECT.md
  adr/
  _snippets/

# Reachable by URL but deliberately absent from the nav.  Declaring it here
# rather than leaving it undeclared keeps `--strict` output clean, so a page
# that is *accidentally* orphaned still stands out.
# The archive (M2-9, #67) is the bulk of this: those pages are reachable at
# the URLs they have always had and are listed on the archive index, but they
# are deliberately absent from the primary nav -- kept for reference, not for
# reading.
not_in_nav: |
  design/rendering.md
  design/style.md
  archive/index.md
  agda-ualib/**
  python/**
  talks/**
  typefunc/**
  probability-quiz/**
  touchpad-forensics/**

theme:
  name: material
  language: en
  # One partial only: partials/source.html, which drops the attribute that
  # makes Material fetch repository facts from api.github.com on every page
  # load.  See the file for the reasoning.
  custom_dir: overrides
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight
    - toc.follow
  # No Google Fonts.  Setting this to false is what removes the
  # <link rel=preconnect> to fonts.gstatic.com and the stylesheet from
  # fonts.googleapis.com that Material's base template emits otherwise;
  # docs/assets/fonts/fonts.css declares the self-hosted faces instead, and
  # tokens.css sets --md-text-font and --md-code-font to name them.  See #17.
  font: false
  # Dark first, and no `media:` on either entry.  Material selects the first
  # palette when nothing is stored, and a `media` key would hand that decision
  # back to the operating system -- which is the behaviour this replaces.  The
  # cost is real and is the reason it is written down: a visitor who has set a
  # light-mode preference system-wide now gets a dark page until they click the
  # toggle once, after which their choice is remembered in local storage.  A
  # dark default is the deliberate look of the site; a mathematics page read at
  # night is the common case.
  #
  # `custom` on primary and accent means "no built-in Material colour" -- the
  # values come from tokens.css.
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  icon:
    repo: fontawesome/brands/github

extra_css:
  # Order matters: the faces have to be declared before the tokens that name
  # them, and the tokens before the rules that use them.
  - assets/fonts/fonts.css
  - stylesheets/tokens.css
  - stylesheets/extra.css
  # Self-hosted KaTeX.  The Zola site loaded it from a CDN alongside a second
  # copy of MathJax; this ships one renderer, from this origin, with the
  # woff/ttf fallbacks stripped from the stylesheet since only woff2 is
  # shipped.  See ADR/#20.
  - assets/katex/katex.min.css

extra_javascript:
  - javascripts/katex-macros.js
  - assets/katex/katex.min.js
  - assets/katex/auto-render.min.js
  - javascripts/katex-init.js

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      permalink_title: Link to this section
  - pymdownx.details
  # Material's icon set, used for the inline :material-*: icons on the
  # contact and CV pages.  Bundled with mkdocs-material; no extra dependency.
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  # The archived-page notice lives in docs/_snippets/archived.md and every
  # archived page includes it, so its wording changes in one place.  M2-4 (#13)
  # needs the same thing for dated posts and should reuse it rather than
  # inventing a second one.
  - pymdownx.snippets:
      base_path: [docs/_snippets]
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  # Generic mode emits KaTeX-compatible markup.  M3-4 wires the renderer and
  # the custom macros the legacy posts rely on (`\bA` and friends).
  - pymdownx.arithmatex:
      generic: true

plugins:
  - search

# Legacy-URL redirects.  The map lives in redirects.yml, where each entry
# carries its reasoning and its blocking issue; this hook emits the stubs.
#
# Deliberately not the mkdocs-redirects plugin: as of 1.2.3 it takes a hard
# dependency on `properdocs`, an entire alternative site generator that
# installs itself and advertises for a replacement on every build.  That is a
# large supply-chain surface, and two more packages to pin in flake.nix, for
# about forty lines of "write a meta-refresh file at a computed path".  See
# #15 and the module docstring.
hooks:
  - scripts/python/redirects_hook.py

nav:
  - Home: index.md
  - About: about.md
  - CV: cv.md
  - Contact: contact.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/williamdemeo
      name: GitHub
    - icon: fontawesome/solid/graduation-cap
      link: https://scholar.google.com/citations?user=y1OQ07QAAAAJ
      name: Google Scholar
